# Only reachable from WhatsAppOtpVerifier, which is not rendered anywhere.
[functions.verify-whatsapp-otp]
enabled = true
verify_jwt = true
entrypoint = "./functions/verify-whatsapp-otp/index.ts"


# Read-only CRM contacts feed for the mobile-crm app (v1 contract).
# JWT verified at the gateway; the function additionally requires tenant_admin.
[functions.crm-contacts]
enabled = true
verify_jwt = true
entrypoint = "./functions/crm-contacts/index.ts"

# Machine-to-machine write path for the lead email ingest worker.
# Auth is the CRM_INGEST_SECRET bearer token (fail-closed), not a user JWT.
[functions.crm-lead-ingest]
enabled = true
verify_jwt = false
entrypoint = "./functions/crm-lead-ingest/index.ts"
