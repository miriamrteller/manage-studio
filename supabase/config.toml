# ============================================================================
# Auth (local dev) — required for magic links / email codes on tenant
# subdomains. Without site_url + additional_redirect_urls, GoTrue rejects the
# redirect to http://<tenant>.localhost:5173/auth/callback and sends magic
# links to its default site_url (localhost:3000 — a dead end), which is why
# magic-link logins "did nothing".
#
# Emails in local dev NEVER reach real inboxes (even @gmail.com addresses):
# read them in the mail catcher at http://localhost:54324 — magic links and
# 6-digit codes for any address land there.
# ============================================================================
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://*.localhost:5173/**",
]
enable_signup = true

# Two-step sign-in (TOTP) for studio admins — Settings → Security
# (docs/legal/11-security-procedure §4.3). Hosted projects: enable TOTP under
# Authentication → Sign In / Providers → Multi-Factor if it is off.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
# Dev convenience: no cooldown between resends while testing codes.
max_frequency = "1s"

# Local mail catcher (Inbucket/Mailpit) — http://localhost:54324
[inbucket]
enabled = true
port = 54324

[functions.send-otp-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-otp-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-otp-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-otp-email/*.html" ]

