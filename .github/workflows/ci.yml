name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Grant all jobs the minimum permissions needed to checkout private repo
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which files changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ui-changed: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            ui:
              # Only components, layouts, pages, and styles (visible changes)
              - 'apps/web/src/components/**'
              - 'apps/web/src/features/**'
              - 'apps/web/src/layouts/**'
              - 'apps/web/src/pages/**'
              - 'apps/web/src/**/*.tsx'
              - 'apps/web/src/**/*.css'
              - 'apps/web/e2e/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Run linter
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Run unit tests
        run: pnpm --filter web test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Build
        run: pnpm run build

  # Supabase Edge Functions (Deno). Nothing else checks these before deploy.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: bash scripts/check-edge-functions.sh
      # Lint rules left off on purpose:
      # - no-import-prefix: functions use inline npm:/https: imports by design
      #   (the esm.sh -> npm: migration is tracked separately).
      # - require-await: provider methods stay async so a throw becomes a
      #   rejected promise, which callers rely on.
      # email-dist is generated output (pnpm email:bundle).
      - name: Lint
        working-directory: supabase/functions
        run: deno lint --rules-exclude=no-import-prefix,require-await --ignore=_shared/email-dist
      # The repo-root package.json would make Deno look for npm: packages in a
      # node_modules this job never installs; resolve them from Deno's cache.
      - name: Unit tests
        working-directory: supabase/functions
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-net

  accessibility:
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if UI files changed (on PR or push)
    if: ${{ needs.detect-changes.outputs.ui-changed == 'true' }}
    # Blocker on main and develop when UI paths change
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Build web app
        run: cp apps/web/.env.e2e apps/web/.env.local && pnpm --filter web build
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run accessibility tests
        run: pnpm --filter web exec playwright test e2e/accessibility-compliance.spec.ts
