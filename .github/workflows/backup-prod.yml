# Nightly encrypted backup of the production database to Cloudflare R2.
#
# Free-tier Supabase has no PITR and no daily backups — this workflow is the
# only thing standing between a bad day and data loss. Restore procedure
# (full and per-tenant): docs/deployment/BACKUP-RESTORE-RUNBOOK.md
#
# Required secrets (see runbook §Setup; repo-level or in the
# "production-nightly" environment):
#   SUPABASE_PROD_DB_URL   session-pooler URL incl. password
#   R2_ACCOUNT_ID          Cloudflare account id
#   R2_ACCESS_KEY_ID       R2 API token key (Object Read & Write on the bucket)
#   R2_SECRET_ACCESS_KEY   R2 API token secret
#
# Until those exist the job exits early with a notice instead of failing, so
# this can merge before R2 is enabled on the account.
#
# The `files` job backs up every Storage bucket (scripts/ci/backup-files-to-r2.sh)
# into the same R2 bucket under files/. Extra secrets, same places:
#   SUPABASE_PROD_S3_ACCESS_KEY_ID      Supabase → Project Settings → Storage →
#   SUPABASE_PROD_S3_SECRET_ACCESS_KEY  S3 access keys (prod project)
#   FILES_BACKUP_PASSWORD               rclone crypt password and salt: long random
#   FILES_BACKUP_SALT                   strings, also kept in the password manager
# Without them the files job skips with a notice. If either job fails, `report`
# opens (or updates) one issue labelled backup-failed.

name: backup-prod

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC nightly (~04:00 Israel)
  workflow_dispatch:

concurrency:
  group: backup-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No reviewers on this environment: it runs unattended every night. It
    # lets SUPABASE_PROD_DB_URL move out of repo-level secrets (where any
    # branch's workflow could read it) — see DEV-PROD-PIPELINE.md §Secrets.
    # Repo-level secrets keep working until then.
    environment: production-nightly
    env:
      BUCKET: manage-studio-db-backups
      # v2 key (2026-08-17): the v1 private key was lost to temp-folder cleanup
      # before any readable backup existed. The 2026-08-17 nightly object in R2
      # is encrypted to v1 and permanently unreadable — delete or let retention
      # expire it. v2's private half lives in the password manager.
      GPG_RECIPIENT: 78851A6D0ECC930F318E33E69199DE35E6163A41
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # Free-tier Supabase pauses projects idle at the API gateway for ~7 days,
      # and internal pg_cron activity does not reliably count. One real REST
      # request per day per project keeps both alive until prod moves to Pro
      # (planned before the first paying tenant). Publishable keys are public
      # by design. Deliberately BEFORE the secrets gate so it works while the
      # R2 secrets are still unset.
      - name: Keepalive ping (prod + dev)
        run: |
          curl -sf -o /dev/null "https://oogxajjanbyqhljxcmql.supabase.co/rest/v1/verticals?select=id&limit=1" \
            -H "apikey: sb_publishable_-bZQ2R-dGyWCeeN1hJo_dA_CGHhbOR9" && echo "prod ping ok"
          curl -sf -o /dev/null "https://acmujrhavgbamdilzuew.supabase.co/rest/v1/verticals?select=id&limit=1" \
            -H "apikey: sb_publishable_0tpFmqEIG_0eM4yJMMtk5g_GBJHffM1" && echo "dev ping ok"

      - name: Check secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_PROD_DB_URL }}" ] || [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            echo "::notice::Backup secrets not configured yet — skipping (see BACKUP-RESTORE-RUNBOOK.md §Setup)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      # Same script as the pre-deploy backup in deploy-prod.yml: dump schema,
      # data and migration history, encrypt to the v2 key, upload to R2.
      - name: Dump, encrypt, upload
        if: steps.gate.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          PREFIX: nightly
        run: bash scripts/ci/backup-prod-to-r2.sh

      # Non-fatal: an Object Read & Write token cannot set bucket lifecycle
      # (AccessDenied, seen 2026-08-17) — and a failed retention step must not
      # mark a SUCCESSFUL backup as a failed run. Either bump the R2 token to
      # Admin Read & Write on this bucket, or set the two rules once in the
      # dashboard (nightly/ 30d, monthly/ 400d); the step then succeeds/no-ops.
      - name: Apply retention lifecycle (best-effort)
        if: steps.gate.outputs.ready == 'true'
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          if ! aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
            --lifecycle-configuration '{
              "Rules": [
                {"ID":"expire-nightly","Status":"Enabled","Filter":{"Prefix":"nightly/"},"Expiration":{"Days":30}},
                {"ID":"expire-monthly","Status":"Enabled","Filter":{"Prefix":"monthly/"},"Expiration":{"Days":400}}
              ]}'; then
            echo "::warning::Could not set R2 lifecycle rules (token lacks bucket admin). Backup itself SUCCEEDED. Set the rules once in the dashboard or upgrade the token — see BACKUP-RESTORE-RUNBOOK.md."
          fi

  # Every Storage bucket, incrementally, encrypted (rclone crypt). Runs next to
  # the database backup; a few seconds on a quiet night.
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-nightly
    steps:
      - name: Check secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_PROD_S3_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.FILES_BACKUP_PASSWORD }}" ] \
            || [ -z "${{ secrets.FILES_BACKUP_SALT }}" ] || [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            echo "::notice::Files backup secrets not configured yet — skipping (see BACKUP-RESTORE-RUNBOOK.md §Files)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          sparse-checkout: scripts/ci/backup-files-to-r2.sh
          sparse-checkout-cone-mode: false

      - name: Install rclone
        if: steps.gate.outputs.ready == 'true'
        run: sudo apt-get install -y -qq rclone >/dev/null && rclone version | head -1

      - name: Sync Storage → R2 (encrypted)
        if: steps.gate.outputs.ready == 'true'
        env:
          SUPABASE_PROJECT_REF: oogxajjanbyqhljxcmql
          SUPABASE_S3_REGION: eu-central-1
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_PROD_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_PROD_S3_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: manage-studio-db-backups
          FILES_BACKUP_PASSWORD: ${{ secrets.FILES_BACKUP_PASSWORD }}
          FILES_BACKUP_SALT: ${{ secrets.FILES_BACKUP_SALT }}
        run: bash scripts/ci/backup-files-to-r2.sh

  # Only runs when a backup failed: one open issue, updated each night it fails.
  report:
    needs: [backup, files]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DB: ${{ needs.backup.result }}
      FILES: ${{ needs.files.result }}
    steps:
      - name: Open or update the backup-failed issue
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Nightly backup failed on $(date -u +%F): database $DB, files $FILES. Run: $run_url
          Restore and setup: docs/deployment/BACKUP-RESTORE-RUNBOOK.md"
          gh label create backup-failed --color B60205 --description "Nightly prod backup failed" 2>/dev/null || true
          existing=$(gh issue list --label backup-failed --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly prod backup failed" --label backup-failed --body "$body"
          fi
          echo "::warning::Backup failed (database: $DB, files: $FILES)"
