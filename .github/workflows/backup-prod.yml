# Nightly encrypted backup of the production database to Cloudflare R2.
#
# Free-tier Supabase has no PITR and no daily backups — this workflow is the
# only thing standing between a bad day and data loss. Restore procedure
# (full and per-tenant): docs/deployment/BACKUP-RESTORE-RUNBOOK.md
#
# Required repo secrets (see runbook §Setup):
#   SUPABASE_PROD_DB_URL   session-pooler URL incl. password
#   R2_ACCOUNT_ID          Cloudflare account id
#   R2_ACCESS_KEY_ID       R2 API token key (Object Read & Write on the bucket)
#   R2_SECRET_ACCESS_KEY   R2 API token secret
#
# Until those exist the job exits early with a notice instead of failing, so
# this can merge before R2 is enabled on the account.

name: backup-prod

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC nightly (~04:00 Israel)
  workflow_dispatch:

concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUCKET: manage-studio-db-backups
      # v2 key (2026-08-17): the v1 private key was lost to temp-folder cleanup
      # before any readable backup existed. The 2026-08-17 nightly object in R2
      # is encrypted to v1 and permanently unreadable — delete or let retention
      # expire it. v2's private half lives in the password manager.
      GPG_RECIPIENT: 78851A6D0ECC930F318E33E69199DE35E6163A41
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # Free-tier Supabase pauses projects idle at the API gateway for ~7 days,
      # and internal pg_cron activity does not reliably count. One real REST
      # request per day per project keeps both alive until prod moves to Pro
      # (planned before the first paying tenant). Publishable keys are public
      # by design. Deliberately BEFORE the secrets gate so it works while the
      # R2 secrets are still unset.
      - name: Keepalive ping (prod + dev)
        run: |
          curl -sf -o /dev/null "https://oogxajjanbyqhljxcmql.supabase.co/rest/v1/verticals?select=id&limit=1" \
            -H "apikey: sb_publishable_-bZQ2R-dGyWCeeN1hJo_dA_CGHhbOR9" && echo "prod ping ok"
          curl -sf -o /dev/null "https://acmujrhavgbamdilzuew.supabase.co/rest/v1/verticals?select=id&limit=1" \
            -H "apikey: sb_publishable_0tpFmqEIG_0eM4yJMMtk5g_GBJHffM1" && echo "dev ping ok"

      - name: Check secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_PROD_DB_URL }}" ] || [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            echo "::notice::Backup secrets not configured yet — skipping (see BACKUP-RESTORE-RUNBOOK.md §Setup)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      - name: Dump schema and data
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          supabase db dump --db-url "${{ secrets.SUPABASE_PROD_DB_URL }}" -f schema.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_PROD_DB_URL }}" --data-only --use-copy -f data.sql
          test -s schema.sql && test -s data.sql

      - name: Build manifest
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          MIGRATIONS=$(psql "${{ secrets.SUPABASE_PROD_DB_URL }}" -tAc \
            "SELECT count(*) FROM supabase_migrations.schema_migrations")
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg stamp "$STAMP" \
            --arg sha "$GITHUB_SHA" \
            --arg migrations "$MIGRATIONS" \
            --arg schema_sha256 "$(sha256sum schema.sql | cut -d' ' -f1)" \
            --arg data_sha256 "$(sha256sum data.sql | cut -d' ' -f1)" \
            '{created_utc:$stamp, main_sha:$sha, migrations:($migrations|tonumber),
              schema_sha256:$schema_sha256, data_sha256:$data_sha256,
              project_ref:"oogxajjanbyqhljxcmql"}' > manifest.json
          cat manifest.json

      - name: Encrypt
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gpg --import .github/backup-encryption-public-key.asc
          tar czf backup.tar.gz schema.sql data.sql manifest.json
          gpg --batch --yes --trust-model always -r "$GPG_RECIPIENT" -o backup.tar.gz.gpg -e backup.tar.gz
          shred -u schema.sql data.sql backup.tar.gz

      - name: Upload to R2
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          DAY=$(date -u +%F)
          KEY="nightly/${DAY}_${GITHUB_SHA::7}"
          aws s3 cp backup.tar.gz.gpg "s3://${BUCKET}/${KEY}.tar.gz.gpg" --endpoint-url "$ENDPOINT"
          aws s3 cp manifest.json    "s3://${BUCKET}/${KEY}.manifest.json" --endpoint-url "$ENDPOINT"
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "s3://${BUCKET}/${KEY}.tar.gz.gpg" "s3://${BUCKET}/monthly/${DAY}_${GITHUB_SHA::7}.tar.gz.gpg" --endpoint-url "$ENDPOINT"
            aws s3 cp "s3://${BUCKET}/${KEY}.manifest.json" "s3://${BUCKET}/monthly/${DAY}_${GITHUB_SHA::7}.manifest.json" --endpoint-url "$ENDPOINT"
          fi
          aws s3 ls "s3://${BUCKET}/nightly/" --endpoint-url "$ENDPOINT" | tail -3

      # Non-fatal: an Object Read & Write token cannot set bucket lifecycle
      # (AccessDenied, seen 2026-08-17) — and a failed retention step must not
      # mark a SUCCESSFUL backup as a failed run. Either bump the R2 token to
      # Admin Read & Write on this bucket, or set the two rules once in the
      # dashboard (nightly/ 30d, monthly/ 400d); the step then succeeds/no-ops.
      - name: Apply retention lifecycle (best-effort)
        if: steps.gate.outputs.ready == 'true'
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          if ! aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
            --lifecycle-configuration '{
              "Rules": [
                {"ID":"expire-nightly","Status":"Enabled","Filter":{"Prefix":"nightly/"},"Expiration":{"Days":30}},
                {"ID":"expire-monthly","Status":"Enabled","Filter":{"Prefix":"monthly/"},"Expiration":{"Days":400}}
              ]}'; then
            echo "::warning::Could not set R2 lifecycle rules (token lacks bucket admin). Backup itself SUCCEEDED. Set the rules once in the dashboard or upgrade the token — see BACKUP-RESTORE-RUNBOOK.md."
          fi
