# Rotate a secret that lives in more than one place, in one run: make ONE new
# value, set every copy, then verify every copy holds it (by SHA-256 digest;
# the value is masked and never printed or stored).
# List of shared secrets and where each copy lives: docs/deployment/SHARED-SECRETS.md
# (CRM_INGEST_SECRET rotates in deploy-lead-email → rotate_ingest_secret.)
#
# Start it: Actions → rotate-secrets → Run workflow (branch main) → secret + project.
#
#   CRON_SECRET             Edge secret CRON_SECRET  +  DB row
#                           private.platform_config.cron_secret (read by pg_cron jobs)
#   SEND_EMAIL_HOOK_SECRET  Edge secret SEND_EMAIL_HOOK_SECRET  +  Auth → Hooks →
#                           Send Email secret (Management API config/auth)
#
# Between the two writes (seconds) a cron call or an auth email can be
# refused once; cron retries on its next tick, a user can resend the email.
#
# Environment "production" (prod, owner approval) or "development" (dev):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROD_DB_URL / SUPABASE_DEV_DB_URL
# (the same secrets deploy-prod / deploy-dev use).

name: rotate-secrets

on:
  workflow_dispatch:
    inputs:
      secret:
        description: "Which shared secret to rotate"
        type: choice
        options:
          - CRON_SECRET
          - SEND_EMAIL_HOOK_SECRET
      project:
        description: "Which Supabase project"
        type: choice
        default: prod
        options:
          - prod
          - dev

permissions:
  contents: read

# Never while a deploy of the same project runs.
concurrency:
  group: ${{ inputs.project == 'dev' && 'supabase-deploy-dev' || 'supabase-deploy-prod' }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.project == 'dev' && 'development' || 'production' }}
    env:
      SECRET: ${{ inputs.secret }}
      REF: ${{ inputs.project == 'dev' && 'acmujrhavgbamdilzuew' || 'oogxajjanbyqhljxcmql' }}
      API: https://api.supabase.com/v1/projects/${{ inputs.project == 'dev' && 'acmujrhavgbamdilzuew' || 'oogxajjanbyqhljxcmql' }}
    steps:
      - name: Main only, secrets configured
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_DB: ${{ (inputs.project == 'dev' && secrets.SUPABASE_DEV_DB_URL || secrets.SUPABASE_PROD_DB_URL) != '' }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Rotations run only from main."; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set in this environment."; exit 1; }
          if [ "$SECRET" = CRON_SECRET ] && [ "$HAS_DB" != true ]; then
            echo "::error::The database URL secret is not set in this environment."; exit 1
          fi

      - name: Rotate ${{ inputs.secret }} (${{ inputs.project }})
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ inputs.project == 'dev' && secrets.SUPABASE_DEV_DB_URL || secrets.SUPABASE_PROD_DB_URL }}
        run: |
          set -uo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }

          # Edge secret digest as the Management API reports it (never the value).
          edge_digest() {
            curl -sf "${auth[@]}" "$API/secrets" | jq -r --arg n "$SECRET" '.[] | select(.name == $n) | .value' || echo ""
          }
          set_edge() {
            local body code
            body=$(jq -nc --arg n "$SECRET" --arg v "$1" '[{name:$n,value:$v}]')
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" -H "Content-Type: application/json" \
              --data "$body" "$API/secrets" || echo 000)
            case "$code" in 200|201) return 0 ;; *) echo "Edge secret: HTTP $code"; return 1 ;; esac
          }

          case "$SECRET" in
            CRON_SECRET)
              value=$(openssl rand -hex 32)
              echo "::add-mask::$value"
              # Copy 1: the DB row pg_cron reads (get_cron_secret()). Value via
              # the environment (\getenv), never on a command line.
              export CRON_NEW="$value"
              if ! psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 >/dev/null 2>&1 <<'SQL'
          \getenv v CRON_NEW
          INSERT INTO private.platform_config (key, value) VALUES ('cron_secret', :'v')
            ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
          SQL
              then
                echo "::error::Could not write private.platform_config.cron_secret. Nothing changed."; exit 1
              fi
              unset CRON_NEW
              echo "DB row cron_secret: set."
              # Copy 2: the Edge secret the functions compare with.
              if ! set_edge "$value"; then
                echo "::error::The DB has the NEW cron secret but the Edge Functions do not. Re-run this rotation."; exit 1
              fi
              echo "Edge secret CRON_SECRET: set."
              # Verify both copies.
              want=$(sha "$value")
              db=$(psql "$DB_URL" -X -tA -v ON_ERROR_STOP=1 -c \
                "SELECT encode(sha256(convert_to(value, 'UTF8')), 'hex') FROM private.platform_config WHERE key = 'cron_secret'" 2>/dev/null || echo "")
              edge=$(edge_digest)
              ;;
            SEND_EMAIL_HOOK_SECRET)
              # Standard Webhooks format the Auth hook expects.
              value="v1,whsec_$(openssl rand -base64 32)"
              echo "::add-mask::$value"
              # Preflight (no write): the Auth config must expose the hook secret field.
              cfg=$(curl -sf "${auth[@]}" "$API/config/auth") || { echo "::error::Could not read the Auth config. Nothing changed."; exit 1; }
              jq -e 'has("hook_send_email_secrets")' <<<"$cfg" >/dev/null || { echo "::error::Auth config has no hook_send_email_secrets field. Nothing changed."; exit 1; }
              echo "Send Email hook enabled: $(jq -r '.hook_send_email_enabled' <<<"$cfg")"
              # Copy 1: Auth → Hooks → Send Email.
              body=$(jq -nc --arg v "$value" '{hook_send_email_secrets:$v}')
              code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "${auth[@]}" -H "Content-Type: application/json" \
                --data "$body" "$API/config/auth" || echo 000)
              case "$code" in
                200|201) echo "Auth hook secret: set." ;;
                *) echo "::error::Could not set the Auth hook secret (HTTP $code). Nothing changed."; exit 1 ;;
              esac
              # Copy 2: the Edge secret send-auth-email verifies with.
              if ! set_edge "$value"; then
                echo "::error::Auth has the NEW hook secret but send-auth-email does not, so auth emails fail. Re-run this rotation now."; exit 1
              fi
              echo "Edge secret SEND_EMAIL_HOOK_SECRET: set."
              want=$(sha "$value")
              db=$(curl -sf "${auth[@]}" "$API/config/auth" | jq -r '.hook_send_email_secrets // ""' | { read -r v; sha "$v"; } || echo "")
              edge=$(edge_digest)
              ;;
            *) echo "::error::unknown secret $SECRET"; exit 1 ;;
          esac

          ok=1
          [ "$db" = "$want" ] && echo "verify: copy 1 matches" || { echo "::error::copy 1 does not hold the new value"; ok=0; }
          [ "$edge" = "$want" ] && echo "verify: Edge secret matches" || { echo "::error::the Edge secret does not hold the new value (digest mismatch or not readable)"; ok=0; }
          {
            echo "## $SECRET rotated on ${REF}"
            echo "- copy 1 ($([ "$SECRET" = CRON_SECRET ] && echo 'private.platform_config.cron_secret' || echo 'Auth → Send Email hook')): $([ "$db" = "$want" ] && echo matches || echo MISMATCH)"
            echo "- Edge secret $SECRET: $([ "$edge" = "$want" ] && echo matches || echo MISMATCH)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ $ok = 1 ] || { echo "::error::Copies differ — re-run this rotation."; exit 1; }
