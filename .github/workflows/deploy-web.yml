# Web stage on its own: app-only releases of the Cloudflare Worker
# `opalswift-app` (apps/web, *.opalswift.com).
#
# Normal releases do NOT come through here: deploy-prod builds and deploys the
# app itself, in the same approved job, right after the database deploy and
# its checks pass (one approval per release). This workflow is for:
#   - Actions → deploy-web → Run workflow (app-only release from main; tick
#     build_only to build and check without deploying)
#   - a tag `prod-web-*` on a commit that is already on main (e.g. a rollback)
#
# The deploy job uses environment "production": the owner approves it.
# The steps live in .github/actions/web-release (shared with deploy-prod).
# Build settings are that environment's VARIABLES. Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   wrangler deploy
#   SENTRY_AUTH_TOKEN (+ vars SENTRY_ORG, SENTRY_PROJECT)   optional source maps
# Owner setup and the variable list: docs/deployment/DEV-PROD-PIPELINE.md#web-stage

name: deploy-web

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and check only; do not deploy"
        type: boolean
        default: false
  push:
    tags:
      - "prod-web-*"

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Must be a commit on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main — web deploys come from main only."; exit 1; }

      - uses: ./.github/actions/web-release
        with:
          sha: ${{ github.sha }}
          build-only: ${{ inputs.build_only == true }}
          vars-json: ${{ toJSON(vars) }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
