# PR check for the marketing site (apps/marketing). No secrets, nothing deployed.
# Every local link/src in the site must point to an existing file.
# Deploy: deploy-marketing.yml · Docs: docs/deployment/MARKETING-SITE.md

name: marketing-ci

on:
  pull_request:
    paths:
      - "apps/marketing/**"
      - "scripts/ci/check-marketing-links.mjs"
      - ".github/workflows/marketing-ci.yml"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Links resolve to existing files
        run: node scripts/ci/check-marketing-links.mjs apps/marketing/public
      - name: Nothing outside public/ and functions/ is meant to be served
        run: |
          set -euo pipefail
          extra=$(cd apps/marketing && git ls-files | grep -vE '^(public/|functions/|package\.json$|README\.md$)' || true)
          if [ -n "$extra" ]; then echo "::error::unexpected files in apps/marketing: $extra"; exit 1; fi
      - name: Contact-form function status
        run: |
          if compgen -G "apps/marketing/functions/api/contact.*" >/dev/null; then
            echo "/api/contact function present."
          else
            echo "::warning::apps/marketing/functions/api/contact.* is missing — deploy-marketing will refuse to deploy until it is added."
          fi
