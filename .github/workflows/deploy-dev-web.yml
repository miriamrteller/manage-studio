# Dev website: every merge to main that touches the web app is built against
# the DEV Supabase project and deployed to its own Cloudflare Worker,
# `opalswift-app-dev`, on its own address. Nothing here touches production:
#   - the live Worker `opalswift-app` and its routes (*.opalswift.com) are never
#     named; the dev Worker gets a config generated below with ONLY dev routes;
#   - the build must point at the dev project and must not use opalswift.com.
#
# GitHub Environment "development" (no reviewers, so it runs by itself):
#   secrets   CLOUDFLARE_DEV_API_TOKEN   its own token, used only here
#             CLOUDFLARE_ACCOUNT_ID      the same account id as production (not a secret)
#   variables VITE_SUPABASE_URL          https://acmujrhavgbamdilzuew.supabase.co
#             VITE_SUPABASE_PUBLISHABLE_KEY  the dev publishable key
#             DEV_ROOT_DOMAIN            e.g. opalswift-dev.com or dev.opalswift.com
#             DEV_ZONE_NAME              the Cloudflare zone that holds it, e.g.
#                                        opalswift-dev.com or opalswift.com
#             VITE_SENTRY_DSN, SMOKE_TENANT_SUBDOMAIN (optional)
# Until the token and the domain exist the job skips with a notice.
# Owner setup: docs/deployment/DEV-PROD-PIPELINE.md#dev-website

name: deploy-dev-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dev-web.yml"
  workflow_dispatch:

permissions:
  contents: read

# Own group (never supabase-deploy-dev: a queued run there would be replaced).
# A newer merge replaces a waiting one; the dev site only needs the latest main.
concurrency:
  group: deploy-dev-web
  cancel-in-progress: false

env:
  DEV_REF: acmujrhavgbamdilzuew
  PROD_REF: oogxajjanbyqhljxcmql
  DEV_WORKER: opalswift-app-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Check secrets and settings
        id: gate
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          DEV_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
          DEV_ZONE_NAME: ${{ vars.DEV_ZONE_NAME }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          if [ "$HAS_CF" != "true" ] || [ -z "$DEV_ROOT_DOMAIN" ] || [ -z "$DEV_ZONE_NAME" ]; then
            echo "::notice::Dev website not set up yet (CLOUDFLARE_DEV_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DEV_ROOT_DOMAIN, DEV_ZONE_NAME in the 'development' environment) — skipping. See DEV-PROD-PIPELINE.md#dev-website."
            echo "### Dev website skipped — not set up yet" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          fail=0
          case "$VITE_SUPABASE_URL" in
            *"$DEV_REF"*) ;;
            *) echo "::error::VITE_SUPABASE_URL is not the dev project ($DEV_REF)."; fail=1 ;;
          esac
          case "$VITE_SUPABASE_URL" in *"$PROD_REF"*) echo "::error::VITE_SUPABASE_URL points at PROD — the dev website must never use the live database."; fail=1 ;; esac
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is not set."; fail=1; }
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY holds a SECRET key. It would ship to every browser — rotate it and use the publishable key."; fail=1 ;;
          esac
          # The live address is never the dev root: tenants on opalswift.com are real studios.
          case "$DEV_ROOT_DOMAIN" in
            opalswift.com|www.opalswift.com|app.opalswift.com) echo "::error::DEV_ROOT_DOMAIN must not be the live domain."; fail=1 ;;
            *.*) ;;
            *) echo "::error::DEV_ROOT_DOMAIN '$DEV_ROOT_DOMAIN' is not a domain."; fail=1 ;;
          esac
          case "$DEV_ROOT_DOMAIN" in
            "$DEV_ZONE_NAME"|*".$DEV_ZONE_NAME") ;;
            *) echo "::error::DEV_ROOT_DOMAIN must be in the zone DEV_ZONE_NAME."; fail=1 ;;
          esac
          bad=$(jq -r 'keys[] | select(. == "VITE_DEMO_MODE")' <<<"$ALL_VARS")
          [ -z "$bad" ] || { echo "::error::Remove VITE_DEMO_MODE: the dev website runs the real app against the dev database."; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v2
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: "pnpm"
      - name: pnpm install
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build (dev database)
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: development
          VITE_ENABLE_SELF_SERVE_SIGNUP: ${{ vars.VITE_ENABLE_SELF_SERVE_SIGNUP }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ENABLE_FINANCE_WALKTHROUGH: ${{ vars.VITE_ENABLE_FINANCE_WALKTHROUGH }}
          VITE_DEMO_MODE: ""
          VITE_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ls apps/web/.env.production* apps/web/.env.local >/dev/null 2>&1; then
            echo "::error::an .env file is committed in apps/web"; exit 1
          fi
          pnpm run build
          dist=apps/web/dist
          test -f "$dist/index.html"
          grep -rlq "$DEV_REF" "$dist/assets" || { echo "::error::built bundle does not reference the dev project"; exit 1; }
          if grep -rlq "$PROD_REF" "$dist"; then echo "::error::built bundle references the PROD project"; exit 1; fi
          if grep -rlq "sb_secret_" "$dist"; then echo "::error::a secret key ended up in the bundle"; exit 1; fi

      # A config of its own, so the live Worker's name and routes can never be used here.
      - name: Write the dev Worker config
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/web
        env:
          DEV_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
          DEV_ZONE_NAME: ${{ vars.DEV_ZONE_NAME }}
        run: |
          set -euo pipefail
          compat=$(sed -n 's/.*"compatibility_date": *"\([^"]*\)".*/\1/p' wrangler.jsonc | head -1)
          [ -n "$compat" ] || { echo "::error::compatibility_date not found in wrangler.jsonc"; exit 1; }
          jq -n --arg name "$DEV_WORKER" --arg compat "$compat" --arg root "$DEV_ROOT_DOMAIN" --arg zone "$DEV_ZONE_NAME" '{
            name: $name,
            compatibility_date: $compat,
            main: "worker/index.ts",
            assets: { directory: "./dist", binding: "ASSETS", not_found_handling: "single-page-application", run_worker_first: true },
            workers_dev: false,
            routes: [
              { pattern: ("*." + $root + "/*"), zone_name: $zone },
              { pattern: ("app." + $root + "/*"), zone_name: $zone }
            ],
            observability: { enabled: true }
          }' > wrangler.dev.generated.json
          cat wrangler.dev.generated.json
          grep -q '"opalswift-app"' wrangler.dev.generated.json && { echo "::error::dev config names the live Worker"; exit 1; }
          if grep -q '"\*\.opalswift\.com/\*"\|"app\.opalswift\.com/\*"' wrangler.dev.generated.json; then echo "::error::dev config carries a live route"; exit 1; fi

      - name: wrangler deploy (opalswift-app-dev)
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          DEV_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
        run: |
          pnpm exec wrangler deploy --config wrangler.dev.generated.json \
            --var "SUPABASE_URL:$VITE_SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$VITE_SUPABASE_PUBLISHABLE_KEY" \
            --var "APP_ROOT_DOMAIN:$DEV_ROOT_DOMAIN"

      - name: Smoke (app shell and a dev studio answer)
        if: steps.gate.outputs.ready == 'true'
        env:
          DEV_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
          SMOKE_TENANT_SUBDOMAIN: ${{ vars.SMOKE_TENANT_SUBDOMAIN }}
        run: |
          set -uo pipefail
          ok=1
          for host in "app.$DEV_ROOT_DOMAIN" "${SMOKE_TENANT_SUBDOMAIN:-creativeballet}.$DEV_ROOT_DOMAIN"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://$host/")
            echo "https://$host/ → $code"
            [ "$code" = 200 ] || ok=0
          done
          {
            echo "## Dev website \`${GITHUB_SHA::7}\`"
            echo "- Address: https://app.$DEV_ROOT_DOMAIN (studios: https://<studio>.$DEV_ROOT_DOMAIN)"
            echo "- Database: dev (\`$DEV_REF\`)"
            echo "- Answering: $([ $ok = 1 ] && echo yes || echo NO)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ $ok = 1 ] || { echo "::error::Deployed, but the dev site did not answer 200 — check DNS for the dev domain (DEV-PROD-PIPELINE.md#dev-website)."; exit 1; }
